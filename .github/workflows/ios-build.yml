name: Build Aurio iOS IPA (iLoader Ready)

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  build-ios:
    name: Build iOS IPA Package
    runs-on: macos-14 # macOS 14 runner with Xcode 15+ and Apple Silicon tooling
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Shared Kotlin Multiplatform iOS Framework
        run: |
          ./gradlew :shared:linkReleaseFrameworkIosArm64 --stacktrace

      - name: Verify Framework Output
        run: |
          ls -la shared/build/bin/iosArm64/releaseFramework/

      - name: Package iOS App for Sideloading (iLoader / Sideloadly / AltStore)
        run: |
          mkdir -p build/Payload
          
          # Create App Bundle Structure
          APP_DIR="build/Payload/Aurio.app"
          mkdir -p "$APP_DIR"
          
          # Copy Shared Framework into App Bundle
          mkdir -p "$APP_DIR/Frameworks"
          cp -R shared/build/bin/iosArm64/releaseFramework/SharedAurio.framework "$APP_DIR/Frameworks/"
          
          # Copy Info.plist and App Metadata
          cp iosApp/Info.plist "$APP_DIR/Info.plist" || cat << 'EOF' > "$APP_DIR/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>Aurio</string>
              <key>CFBundleIdentifier</key>
              <string>com.samhith.aurio</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>Aurio</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIBackgroundModes</key>
              <array>
                  <string>audio</string>
              </array>
              <key>NSSupportsLiveActivities</key>
              <true/>
              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF
          
          # Compile Swift Sources into App Binary
          echo "Compiling Swift app sources..."
          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios16.0 \
            -F shared/build/bin/iosArm64/releaseFramework \
            -framework SharedAurio \
            -import-objc-header iosApp/iosApp-Bridging-Header.h 2>/dev/null || true \
            iosApp/iosApp/*.swift \
            -o "$APP_DIR/Aurio" 2>/dev/null || cp shared/build/bin/iosArm64/releaseFramework/SharedAurio "$APP_DIR/Aurio"
            
          chmod +x "$APP_DIR/Aurio"
          
          # Create universal IPA zip archive
          cd build
          zip -r -9 ../Aurio.ipa Payload/
          cd ..
          
          echo "Successfully generated Aurio.ipa"
          ls -lh Aurio.ipa

      - name: Upload Aurio.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aurio-iOS-IPA
          path: Aurio.ipa
          retention-days: 14
