name: Build Aurio iOS IPA (iLoader Ready)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'

jobs:
  build-ios:
    name: Build iOS IPA Package
    runs-on: macos-14
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Executable
        run: chmod +x ./gradlew

      - name: Build Kotlin Multiplatform Framework
        run: |
          ./gradlew :shared:linkReleaseFrameworkIosArm64 --no-daemon --stacktrace

      - name: Verify Framework Output
        run: |
          ls -la shared/build/bin/iosArm64/releaseFramework/

      - name: Create iOS App Bundle & IPA Package
        run: |
          rm -rf build/Payload build/Aurio.ipa
          mkdir -p build/Payload/Aurio.app/Frameworks
          
          # Copy Shared Framework into App Bundle
          cp -R shared/build/bin/iosArm64/releaseFramework/SharedAurio.framework build/Payload/Aurio.app/Frameworks/
          
          # Copy Info.plist
          cp iosApp/Info.plist build/Payload/Aurio.app/Info.plist
          
          # Get iPhoneOS SDK path
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using iPhoneOS SDK at: $SDK_PATH"
          
          # Compile Swift sources with library parsing and framework rpath
          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios16.0 \
            -sdk "$SDK_PATH" \
            -F shared/build/bin/iosArm64/releaseFramework \
            -framework SharedAurio \
            -Xlinker -rpath -Xlinker @executable_path/Frameworks \
            -parse-as-library \
            iosApp/iosApp/iOSApp.swift \
            iosApp/iosApp/ContentView.swift \
            -o build/Payload/Aurio.app/Aurio
            
          chmod +x build/Payload/Aurio.app/Aurio
          
          # Package into universal IPA
          cd build
          zip -r -9 ../Aurio.ipa Payload/
          cd ..
          
          echo "=== Successfully created Aurio.ipa ==="
          ls -lh Aurio.ipa

      - name: Upload Aurio.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aurio-iOS-IPA
          path: Aurio.ipa
          retention-days: 14
