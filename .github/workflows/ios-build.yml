name: Build Aurio iOS (Simulator & Device IPA)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'

jobs:
  build-ios:
    name: Build iOS Packages
    runs-on: macos-14
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Executable
        run: chmod +x ./gradlew

      - name: Build KMP Frameworks (Device & Simulator)
        run: |
          ./gradlew :shared:linkReleaseFrameworkIosArm64 :shared:linkReleaseFrameworkIosSimulatorArm64 --no-daemon --stacktrace

      - name: Build iOS Simulator App (for Appetize.io / Browser)
        run: |
          rm -rf build/Simulator Aurio-Simulator.zip
          mkdir -p build/Simulator/Aurio.app/Frameworks
          
          # Copy Simulator Framework
          cp -R shared/build/bin/iosSimulatorArm64/releaseFramework/SharedAurio.framework build/Simulator/Aurio.app/Frameworks/
          
          # Copy Info.plist
          cp iosApp/Info.plist build/Simulator/Aurio.app/Info.plist
          
          # Get iPhoneSimulator SDK path
          SIM_SDK_PATH=$(xcrun --sdk iphonesimulator --show-sdk-path)
          echo "Using iPhoneSimulator SDK at: $SIM_SDK_PATH"
          
          # Compile Swift sources for Simulator
          xcrun -sdk iphonesimulator swiftc \
            -target arm64-apple-ios16.0-simulator \
            -sdk "$SIM_SDK_PATH" \
            -F shared/build/bin/iosSimulatorArm64/releaseFramework \
            -framework SharedAurio \
            -Xlinker -rpath -Xlinker @executable_path/Frameworks \
            -parse-as-library \
            iosApp/iosApp/*.swift \
            -o build/Simulator/Aurio.app/Aurio
            
          chmod +x build/Simulator/Aurio.app/Aurio
          
          # Zip Aurio.app for Appetize.io
          cd build/Simulator
          zip -r -9 ../../Aurio-Simulator.zip Aurio.app
          cd ../..
          
          echo "=== Successfully created Aurio-Simulator.zip for Appetize.io ==="
          ls -lh Aurio-Simulator.zip

      - name: Build Physical iPhone IPA (for iLoader / Sideloadly)
        run: |
          rm -rf build/Payload build/Aurio.ipa
          mkdir -p build/Payload/Aurio.app/Frameworks
          
          # Copy Device Framework
          cp -R shared/build/bin/iosArm64/releaseFramework/SharedAurio.framework build/Payload/Aurio.app/Frameworks/
          
          # Copy Info.plist
          cp iosApp/Info.plist build/Payload/Aurio.app/Info.plist
          
          # Get iPhoneOS SDK path
          DEV_SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using iPhoneOS SDK at: $DEV_SDK_PATH"
          
          # Compile Swift sources for Physical Device
          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios16.0 \
            -sdk "$DEV_SDK_PATH" \
            -F shared/build/bin/iosArm64/releaseFramework \
            -framework SharedAurio \
            -Xlinker -rpath -Xlinker @executable_path/Frameworks \
            -parse-as-library \
            iosApp/iosApp/*.swift \
            -o build/Payload/Aurio.app/Aurio
            
          chmod +x build/Payload/Aurio.app/Aurio
          
          # Package into universal IPA
          cd build
          zip -r -9 ../Aurio.ipa Payload/
          cd ..
          
          echo "=== Successfully created Aurio.ipa for Physical Device ==="
          ls -lh Aurio.ipa

      - name: Upload Simulator Build (Appetize.io Ready)
        uses: actions/upload-artifact@v4
        with:
          name: Aurio-Simulator-Appetize
          path: Aurio-Simulator.zip
          retention-days: 14

      - name: Upload Physical Device IPA (iLoader / Sideloadly)
        uses: actions/upload-artifact@v4
        with:
          name: Aurio-Device-IPA
          path: Aurio.ipa
          retention-days: 14

